/* 3Dの水槽が全画面。操作はガラス越しの小さなドックと、下から出るシート */
:root {

}
html, body { height: 100%; }
[hidden] { display: none !important; }
body {
  margin: 0; overflow: hidden; background: var(--deep); color: var(--ink);
  font-family: var(--font); -webkit-user-select: none; user-select: none;
  touch-action: manipulation; -webkit-tap-highlight-color: transparent;
}
#tank { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }

}

button.primary { background: var(--coral); border-color: transparent; color: var(--coral-ink); }
button.warn { color: var(--warn); }
button:active { transform: scale(.96); }

.loading { position: fixed; inset: 0; display: grid; place-items: center; font-size: 15px; color: var(--ink-dim); }

.dock {
  position: fixed; right: max(16px, env(safe-area-inset-right, 0px));
  bottom: calc(16px + env(safe-area-inset-bottom, 0px));
  display: flex; flex-direction: row-reverse; align-items: center; gap: 8px; max-width: calc(100vw - 32px);
}
.tools { display: flex; flex-wrap: wrap-reverse; justify-content: flex-end; gap: 8px; }
.fab { width: 52px; height: 52px; padding: 0; display: grid; place-items: center; flex: none; opacity: .55; transition: opacity .3s; }
.fab:hover, .fab[aria-expanded="true"] { opacity: 1; }
.fab svg { transition: transform .3s; }
.fab[aria-expanded="true"] svg { transform: rotate(45deg); }

.hint, .toast {
  position: fixed; left: 50%; top: calc(16px + env(safe-area-inset-top, 0px)); transform: translateX(-50%);
  font-size: 13px; color: var(--ink); background: var(--glass); border: 1px solid var(--line);
  border-radius: 999px; padding: 9px 15px; white-space: nowrap; pointer-events: none;
  transition: opacity .6s; max-width: calc(100vw - 32px); overflow: hidden; text-overflow: ellipsis;
}
.gone { opacity: 0; }

.tag {
  position: fixed; left: 0; top: 0; pointer-events: none; transform: translate(-50%, -100%);
  background: rgba(8, 26, 44, .86); border: 1px solid var(--line); border-radius: 14px;
  padding: 7px 12px; text-align: center; transition: opacity .3s; white-space: nowrap;
}
.tag b { display: block; font-size: 14px; }
.tag small { display: block; font-size: 11px; color: var(--ink-dim); font-variant-numeric: tabular-nums; }

.sheet {
  position: fixed; inset: 0; display: flex; align-items: flex-end; justify-content: center; background: rgba(2, 10, 20, .5);
  padding: calc(12px + env(safe-area-inset-top, 0px)) max(12px, env(safe-area-inset-right, 0px)) calc(12px + env(safe-area-inset-bottom, 0px)) max(12px, env(safe-area-inset-left, 0px));
}

  background: var(--glass-strong); border: 1px solid var(--line); border-radius: 24px; padding: 16px; display: grid; gap: 12px;
  -webkit-backdrop-filter: blur(16px); backdrop-filter: blur(16px);
}
.ph { display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; }

  background: repeating-linear-gradient(0deg, transparent 0 23px, rgba(255,255,255,.05) 23px 24px),
              repeating-linear-gradient(90deg, transparent 0 23px, rgba(255,255,255,.05) 23px 24px), var(--paper); }

.palette { display: flex; flex-wrap: wrap; gap: 8px; }

  background: conic-gradient(#ff5e5b, #ffd84d, #3ccf91, #5cc8ff, #9b6bff, #ff6fa8, #ff5e5b); }

.foot { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.foot label { display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--ink-dim); flex: 1 1 180px; min-width: 0; }
.foot input[type="text"] { flex: 1; min-width: 0; font: 500 16px var(--font); color: var(--ink); background: rgba(0,0,0,.25); border: 1px solid var(--line); border-radius: 12px; padding: 9px 12px; }

.grid { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; }
.card { background: rgba(0,0,0,.22); border: 1px solid var(--line); border-radius: 16px; padding: 10px; display: grid; gap: 6px; min-width: 0; }
.card .thumb { aspect-ratio: 4 / 3; border-radius: 10px; background: linear-gradient(#1f7fae, #0b3f6e); display: grid; place-items: center; overflow: hidden; }
.card img { max-width: 86%; max-height: 80%; object-fit: contain; }
.card b { font-size: 15px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.card small { font-size: 12px; color: var(--ink-dim); font-variant-numeric: tabular-nums; }

.sub { margin: 4px 0 0; font-size: 15px; font-weight: 900; letter-spacing: .04em; }

.editbar {

  padding: 12px max(12px, env(safe-area-inset-right, 0px)) calc(12px + env(safe-area-inset-bottom, 0px)) max(12px, env(safe-area-inset-left, 0px));

.ebtop { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.ebtop .push { margin-left: auto; }
.items { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 2px; scrollbar-width: none; }
.items button { flex: none; font-size: 13px; padding: 10px 14px; }
.selbar { display: flex; flex-wrap: wrap; gap: 8px 12px; align-items: center; background: var(--glass-strong); border: 1px solid var(--line); border-radius: 18px; padding: 10px 12px; }
.selbar label { display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--ink-dim); flex: 1 1 150px; min-width: 0; }
.selbar input[type="range"] { flex: 1; min-width: 0; accent-color: var(--coral); }

.selbar button { padding: 8px 12px; font-size: 13px; }
@media (prefers-reduced-motion: reduce) { .fab, .fab svg, .hint, .toast { transition: none; } .heart { animation-duration: .01s; } }

import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

const $ = id => document.getElementById(id);
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const lerp = (a, b, t) => a + (b - a) * t;

const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;

  get(k, d) { try { const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch { return d; } },

// ================= 乱数とノイズ（シードから同じ形を作り直せるように） =================

const U = { time: { value: 0 }, cau: { value: 1 } };

// 水中の光のゆらめき（コースティクス）を標準マテリアルに足す
const CAUSTIC_GLSL = `
uniform float uTime; uniform float uCau; varying vec3 vCW; varying vec3 vCN;
float cauF(vec2 uv){
  vec2 p = mod(uv*6.28318, 6.28318) - 250.0; vec2 i = p; float c = 1.0; float inten = .005; float t = uTime*.45 + 23.0;

}

  bubbleGeo.setDrawRange(0, bubbleData.length); bubbleGeo.attributes.position.needsUpdate = true;

    const [a, b] = [...pointers.values()]; pinch0 = Math.hypot(a.x - b.x, a.y - b.y); dist0 = cam.tdist; drag = null; return;
  }

  } else {

  b.onclick = () => pickColor(c); palette.insertBefore(b, palette.lastElementChild);
});
function pickColor(c) {
  color = c; palette.querySelectorAll('.sw').forEach(x => x.setAttribute('aria-pressed', String(x.dataset.color === c)));
  if (tool === 'erase') setTool('pen');
}
$('customColor').addEventListener('input', e => pickColor(e.target.value));
const segPick = (seg, attr, fn) => seg.querySelectorAll('button').forEach(b => b.onclick = () => {
  seg.querySelectorAll('button').forEach(x => x.setAttribute('aria-pressed', String(x === b))); fn(b.dataset[attr]);
});
function setTool(t) { tool = t; $('toolSeg').querySelectorAll('button').forEach(x => x.setAttribute('aria-pressed', String(x.dataset.tool === t))); }
segPick($('toolSeg'), 'tool', v => tool = v);
segPick($('sizeSeg'), 'size', v => size = +v);
segPick($('kinds'), 'kind', v => { kind = v; $('kindTip').textContent = TIPS[kind]; drawGuide(); });
$('kindTip').textContent = TIPS[kind];

function drawGuide() {
  const w = guide.width, h = guide.height, g = gctx;
  g.clearRect(0, 0, w, h);
  g.save(); g.setLineDash([10, 10]); g.lineWidth = 3; g.strokeStyle = 'rgba(255,255,255,.2)';
  g.fillStyle = 'rgba(255,255,255,.35)'; g.font = `700 ${Math.round(w / 26)}px "Zen Maru Gothic", sans-serif`; g.lineCap = 'round';
  if (kind === 'fish') {
    g.beginPath(); g.ellipse(w * .56, h * .5, w * .27, h * .2, 0, 0, 7); g.stroke();
    g.beginPath(); g.moveTo(w * .3, h * .5); g.lineTo(w * .14, h * .32); g.lineTo(w * .14, h * .68); g.closePath(); g.stroke();
    g.textAlign = 'right'; g.fillText('あたま →', w * .94, h * .2); g.textAlign = 'left'; g.fillText('しっぽ', w * .06, h * .84);
  } else if (kind === 'jelly') {
    g.beginPath(); g.ellipse(w * .5, h * .42, w * .2, h * .2, 0, Math.PI, 0); g.stroke();
    g.beginPath(); g.moveTo(w * .3, h * .42); g.lineTo(w * .7, h * .42); g.stroke();
    for (let i = 0; i < 5; i++) { const x = w * (.36 + i * .07); g.beginPath(); g.moveTo(x, h * .44); g.quadraticCurveTo(x + 14, h * .64, x, h * .88); g.stroke(); }
    g.textAlign = 'left'; g.fillText('↑ うえ', w * .05, h * .12); g.fillText('ここがゆれる', w * .05, h * .8);
  } else {
    const base = h * .86;
    g.setLineDash([]); g.strokeStyle = 'rgba(230,207,156,.5)'; g.lineWidth = 4;
    g.beginPath(); g.moveTo(w * .04, base); g.lineTo(w * .96, base); g.stroke();
    g.setLineDash([10, 10]); g.strokeStyle = 'rgba(255,255,255,.2)'; g.lineWidth = 3;
    if (kind === 'walker') {
      g.beginPath(); g.ellipse(w * .5, h * .62, w * .2, h * .14, 0, 0, 7); g.stroke();
      for (const x of [.36, .44, .56, .64]) { g.beginPath(); g.moveTo(w * x, h * .72); g.lineTo(w * x, base); g.stroke(); }
      g.textAlign = 'right'; g.fillText('あたま →', w * .94, h * .2);
    } else {
      g.beginPath(); g.moveTo(w * .38, base); g.lineTo(w * .38, h * .4); g.lineTo(w * .5, h * .22); g.lineTo(w * .62, h * .4); g.lineTo(w * .62, base); g.stroke();
    }
    g.fillStyle = 'rgba(230,207,156,.8)'; g.textAlign = 'left'; g.fillText('砂', w * .05, base - 10);
  }
  g.restore();
}
function openStudio() {
  closeTools(); studio.hidden = false;
  const r = pad.getBoundingClientRect(), w = Math.round(r.width * PS), h = Math.round(r.height * PS);
  if (w > 0 && (pad.width !== w || pad.height !== h)) {
    const keep = mk(pad.width, pad.height); keep.getContext('2d').drawImage(pad, 0, 0);
    pad.width = guide.width = w; pad.height = guide.height = h; pctx.drawImage(keep, 0, 0, w, h); undoStack = [];
  }
  $('nameIn').placeholder = NAMES[Math.floor(Math.random() * NAMES.length)];
  drawGuide();
}
function pushUndo() { undoStack.push(pctx.getImageData(0, 0, pad.width, pad.height)); if (undoStack.length > 20) undoStack.shift(); }
$('undo').onclick = () => { const s = undoStack.pop(); if (s) pctx.putImageData(s, 0, 0); };
$('clear').onclick = () => { pushUndo(); pctx.clearRect(0, 0, pad.width, pad.height); };
const padPt = e => { const r = pad.getBoundingClientRect(); return [(e.clientX - r.left) * pad.width / r.width, (e.clientY - r.top) * pad.height / r.height]; };
function strokeSetup() {
  pctx.globalCompositeOperation = tool === 'erase' ? 'destination-out' : 'source-over';
  pctx.strokeStyle = pctx.fillStyle = color; pctx.lineWidth = (tool === 'erase' ? size * 2 : size) * PS; pctx.lineCap = pctx.lineJoin = 'round';
}
pad.addEventListener('pointerdown', e => {
  e.preventDefault(); const p = padPt(e); pushUndo();
  if (tool === 'fill') { flood(p[0], p[1]); return; }
  drawing = true; pad.setPointerCapture(e.pointerId); pts = [p];
  strokeSetup(); pctx.beginPath(); pctx.arc(p[0], p[1], pctx.lineWidth / 2, 0, 7); pctx.fill();
});
pad.addEventListener('pointermove', e => {
  if (!drawing) return;
  for (const ev of (e.getCoalescedEvents ? e.getCoalescedEvents() : [e])) {
    pts.push(padPt(ev)); const n = pts.length;
    if (n === 2) { const [a, b] = pts; pctx.beginPath(); pctx.moveTo(a[0], a[1]); pctx.lineTo((a[0] + b[0]) / 2, (a[1] + b[1]) / 2); pctx.stroke(); }
    if (n < 3) continue;
    const [a, b, c] = [pts[n - 3], pts[n - 2], pts[n - 1]];
    pctx.beginPath(); pctx.moveTo((a[0] + b[0]) / 2, (a[1] + b[1]) / 2); pctx.quadraticCurveTo(b[0], b[1], (b[0] + c[0]) / 2, (b[1] + c[1]) / 2); pctx.stroke();
  }
});
const endStroke = () => {
  if (drawing && pts.length >= 2) { const a = pts[pts.length - 2], b = pts[pts.length - 1]; pctx.beginPath(); pctx.moveTo((a[0] + b[0]) / 2, (a[1] + b[1]) / 2); pctx.lineTo(b[0], b[1]); pctx.stroke(); }
  drawing = false; pctx.globalCompositeOperation = 'source-over';
};
pad.addEventListener('pointerup', endStroke); pad.addEventListener('pointercancel', endStroke);
function flood(fx, fy) {
  const w = pad.width, h = pad.height, x0 = Math.floor(fx), y0 = Math.floor(fy);
  if (x0 < 0 || y0 < 0 || x0 >= w || y0 >= h) return;
  const img = pctx.getImageData(0, 0, w, h), d = img.data;
  const i0 = (y0 * w + x0) * 4, tr = d[i0], tg = d[i0 + 1], tb = d[i0 + 2], ta = d[i0 + 3];
  const n = parseInt(color.slice(1), 16), r = n >> 16, g = (n >> 8) & 255, b = n & 255, empty = ta < 160;
  if (!empty && Math.abs(tr - r) + Math.abs(tg - g) + Math.abs(tb - b) < 6) return;
  const match = k => empty ? d[k + 3] < 160 : d[k + 3] >= 160 && Math.abs(d[k] - tr) + Math.abs(d[k + 1] - tg) + Math.abs(d[k + 2] - tb) < 90;
  const seen = new Uint8Array(w * h), st = [x0, y0];
  while (st.length) {
    const py = st.pop(), px = st.pop();
    let lx = px; while (lx >= 0 && !seen[py * w + lx] && match((py * w + lx) * 4)) lx--; lx++;
    let up = false, dn = false;
    for (let cx = lx; cx < w; cx++) {
      const k = py * w + cx; if (seen[k] || !match(k * 4)) break;
      seen[k] = 1; const q = k * 4; d[q] = r; d[q + 1] = g; d[q + 2] = b; d[q + 3] = 255;
      if (py > 0) { const ku = k - w, m = !seen[ku] && match(ku * 4); if (m && !up) { st.push(cx, py - 1); up = true; } else if (!m) up = false; }
      if (py < h - 1) { const kd = k + w, m = !seen[kd] && match(kd * 4); if (m && !dn) { st.push(cx, py + 1); dn = true; } else if (!m) dn = false; }
    }
  }
  pctx.putImageData(img, 0, 0);
}
function persist() { if (!store.set(KEY, saved)) { say('保存できませんでした。なかまを減らしてみてください'); return false; } return true; }
$('cancel').onclick = () => studio.hidden = true;
$('release').onclick = () => {
  const w = pad.width, h = pad.height, d = pctx.getImageData(0, 0, w, h).data;
  let x0 = w, y0 = h, x1 = -1, y1 = -1;
  for (let y = 0; y < h; y += 2) for (let x = 0; x < w; x += 2)
    if (d[(y * w + x) * 4 + 3] > 20) { if (x < x0) x0 = x; if (x > x1) x1 = x; if (y < y0) y0 = y; if (y > y1) y1 = y; }
  if (x1 < 0) { say('まだ何も描かれていません'); return; }
  const m = 10; x0 = Math.max(0, x0 - m); y0 = Math.max(0, y0 - m); x1 = Math.min(w, x1 + m); y1 = Math.min(h, y1 + m);
  if (kind === 'walker' || kind === 'deco') y1 = Math.min(h, Math.max(y1, Math.round(h * .86)));
  const cw = x1 - x0, ch = y1 - y0, sc = Math.min(1, 360 / Math.max(cw, ch));
  const out = mk(Math.max(1, Math.round(cw * sc)), Math.max(1, Math.round(ch * sc)));
  const og = out.getContext('2d'); og.imageSmoothingQuality = 'high'; og.drawImage(pad, x0, y0, cw, ch, 0, 0, out.width, out.height);
  const nameIn = $('nameIn');
  const rec = { id: 'c' + Date.now(), kind, name: nameIn.value.trim() || nameIn.placeholder, born: Date.now(), fed: 0, url: out.toDataURL('image/png'), bs: +rand(.9, 1.05).toFixed(2) };
  saved.push(rec); if (!persist()) saved.pop();
  const x = clamp(cam.x * .55 + rand(-2, 2), -7, 7), z = rand(-1, 2.5);
  const c = addCreature({ id: rec.id, kind, name: rec.name, born: rec.born, fed: 0, bs: rec.bs, img: out, x, z, y: TANK.top + 1 });
  dropIn(c, x, z);
  for (let i = 0; i < 16; i++) bubble(x + rand(-.6, .6), TANK.top - rand(.1, 1.2), z + rand(-.4, .4), rand(.5, 1.2));
  showTag(c);
  pctx.clearRect(0, 0, w, h); undoStack = []; nameIn.value = '';
  studio.hidden = true;
};
$('bDraw').onclick = openStudio;

// ================= 用意されている生き物 =================
const PRESET_KEY = 'oekaki-suisou-presets';
const PRESET_TYPES = {
  orange: { label: 'オレンジの魚', kind: 'fish', bs: .9, img: () => presetFish('#ff8a5c', '#ffd84d', '#ffe3c4') },
  blue: { label: '青い魚', kind: 'fish', bs: .9, img: () => presetFish('#5cc8ff', '#2f6fe0', '#d9f3ff') },
  pink: { label: 'ピンクの魚', kind: 'fish', bs: .85, img: () => presetFish('#ff6fa8', '#ffe0ef', '#ffe9f2') },
  angel: { label: 'エンゼルフィッシュ', kind: 'fish', bs: 1.05, img: presetAngel },
  neon: { label: 'ネオンの群れ', kind: 'fish', bs: .32, img: presetNeon, school: 9 },
  jelly: { label: 'クラゲ', kind: 'jelly', bs: 1, img: () => presetJelly('#ffb3d1') },
  crab: { label: 'カニ', kind: 'walker', bs: .8, img: presetCrab }
};
const DEFAULT_PRESETS = [['orange', 'オレンジ'], ['blue', 'アオ'], ['pink', 'サクラ'], ['angel', 'エンゼル'], ['angel', 'シマ'], ['neon', 'ネオン'], ['jelly', 'ふわり'], ['crab', 'カニさん']];
let presetList = store.get(PRESET_KEY, null) || DEFAULT_PRESETS.map(([type, name], i) => ({ id: 'p' + i, type, name, born: Date.now() }));
const presetImgs = {}, presetThumbs = {};
const presetImg = type => presetImgs[type] || (presetImgs[type] = PRESET_TYPES[type].img());
const presetThumb = type => presetThumbs[type] || (presetThumbs[type] = presetImg(type).toDataURL('image/png'));
function savePresets() { store.set(PRESET_KEY, presetList); }
function dropIn(c, x, z) {
  c.pos.set(x, c.kind === 'walker' || c.kind === 'deco' ? TANK.top : TANK.top + 1, z);
  c.vel.set(0, 0, 0); c.enter = true;
}
function spawnPreset(rec, enter) {
  const T = PRESET_TYPES[rec.type]; if (!T) return [];
  const out = [], x = clamp(cam.x * .55 + rand(-2, 2), -7, 7), z = rand(-1, 2.5);
  for (let i = 0; i < (T.school || 1); i++) {
    const c = addCreature({
      kind: T.kind, name: rec.name, born: rec.born, bs: T.bs * rand(.92, 1.08), img: presetImg(rec.type), pid: rec.id,
      school: !!T.school, off: T.school ? new THREE.Vector3(rand(-1.2, 1.2), rand(-.7, .7), rand(-.8, .8)) : undefined,
      x: T.kind === 'walker' ? rand(-4, 4) : undefined, z: T.kind === 'walker' ? rand(2.5, 3.8) : undefined
    });
    if (enter) dropIn(c, x + rand(-.6, .6), z);
    out.push(c);
  }
  if (enter) for (let i = 0; i < 14; i++) bubble(x + rand(-.6, .6), TANK.top - rand(.1, 1.2), z + rand(-.4, .4), rand(.5, 1.2));
  return out;
}
function spawnPresets() { presetList.forEach(rec => spawnPreset(rec, false)); }

// ================= なかま =================
const album = $('album'), list = $('albumList');
function renderAlbum() {
  list.textContent = '';
  const entries = [...presetList.map(rec => ({ rec, preset: true })), ...[...saved].reverse().map(rec => ({ rec, preset: false }))];
  $('albumEmpty').hidden = entries.length > 0;
  for (const { rec, preset } of entries) {
    const li = document.createElement('li'); li.className = 'card';
    li.innerHTML = `<div class="thumb"><img alt=""></div><b></b><small></small><div class="acts"><button data-a="call">よぶ</button><button data-a="bye" class="warn">おわかれ</button></div>`;
    li.querySelector('img').src = preset ? presetThumb(rec.type) : rec.url;
    li.querySelector('b').textContent = rec.name;
    li.querySelector('small').textContent = preset
      ? `${PRESET_TYPES[rec.type]?.label || ''}・${daysOf(rec.born)}日目`
      : `${KIND_LABEL[rec.kind]}・${daysOf(rec.born)}日目・エサ${rec.fed || 0}回`;
    const mine = () => creatures.filter(x => preset ? x.pid === rec.id : x.id === rec.id);
    li.querySelector('[data-a="call"]').onclick = () => {
      const c = mine()[0]; album.hidden = true; if (!c) return;
      if (c.kind === 'fish' && !c.school) c.target.set(cam.x * .55, 6, 2.5);
      if (c.school) school.set(cam.x * .55, 6, 2);
      cam.tx = clamp(c.pos.x / .55, -8, 8); showTag(c); setTimeout(() => heartAt(c), 400);
    };
    const bye = li.querySelector('[data-a="bye"]'); let armed = false, armT;
    bye.onclick = () => {
      if (!armed) { armed = true; bye.textContent = '本当に？'; armT = setTimeout(() => { armed = false; bye.textContent = 'おわかれ'; }, 3000); return; }
      clearTimeout(armT);
      if (preset) { presetList = presetList.filter(r => r.id !== rec.id); savePresets(); }
      else { saved = saved.filter(r => r.id !== rec.id); persist(); }
      for (const c of mine()) { for (let i = 0; i < 6; i++) bubble(c.pos.x + rand(-.5, .5), c.pos.y + rand(-.3, .3), c.pos.z, .8); removeCreature(c); }
      say(`${rec.name}とおわかれしました`); renderAlbum();
    };
    list.appendChild(li);
  }
  const add = $('addList');
  if (!add.childElementCount) for (const [type, T] of Object.entries(PRESET_TYPES)) {
    const b = document.createElement('button'); b.textContent = '＋ ' + T.label;
    b.onclick = () => {
      const used = new Set([...presetList.map(r => r.name), ...saved.map(r => r.name)]);
      const name = NAMES.find(n => !used.has(n)) || NAMES[Math.floor(Math.random() * NAMES.length)];
      const rec = { id: 'p' + Date.now(), type, name, born: Date.now() };
      presetList.push(rec); savePresets();
      const cs = spawnPreset(rec, true);
      album.hidden = true; if (cs[0]) showTag(cs[0]);
      say(`${T.label}の${name}が仲間になりました`);
    };
    add.appendChild(b);
  }
}
$('bAlbum').onclick = () => { closeTools(); renderAlbum(); album.hidden = false; };
$('albumClose').onclick = () => album.hidden = true;
for (const sh of [studio, album]) sh.addEventListener('pointerdown', e => { if (e.target === sh) sh.hidden = true; });

// ================= 起動 =================
async function keepAwake() { try { await navigator.wakeLock?.request('screen'); } catch {} }
document.addEventListener('visibilitychange', () => { if (!document.hidden) keepAwake(); });
function imgFromURL(url) {
  return new Promise(res => { const im = new Image(); im.onload = () => { const c = mk(im.width, im.height); c.getContext('2d').drawImage(im, 0, 0); res(c); }; im.onerror = () => res(null); im.src = url; });
}

buildTextures(); buildLights(); buildEnvironment(); buildGround(); buildParticles();
await loadModels((d, n) => { $('loading').textContent = `流木と石を運んでいます… ${d}/${n}`; });
layout.forEach(d => placeItem(d));
spawnPresets();
for (const rec of saved) {
  const img = await imgFromURL(rec.url);
  if (img) addCreature({ id: rec.id, kind: rec.kind, name: rec.name, born: rec.born, fed: rec.fed || 0, bs: rec.bs || 1, img });
}
for (let i = 0; i < 30; i++) bubble(8.7 + rand(-.15, .15), rand(1.5, TANK.top - .3), -3.9, rand(.6, 1.3));
night = nightTarget();
$('loading').remove();
const hint = $('hint'); hint.hidden = false; setTimeout(() => hint.classList.add('gone'), 5500);
keepAwake();
requestAnimationFrame(frame);
</script>
